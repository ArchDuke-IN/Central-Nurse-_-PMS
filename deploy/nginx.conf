# Nginx configuration for the PMS nurse station.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/pms
#   sudo ln -s /etc/nginx/sites-available/pms /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Nginx is the better host for this than the bundled Node server, because it
# terminates connections, handles TLS, and serves static files without keeping
# a Node process resident. The Node server is the fallback for environments
# where adding a dependency is not acceptable.

# --- TLS -------------------------------------------------------------------
# The station displays patient-identifiable data, so plaintext HTTP is not
# acceptable anywhere but a bench. certbot provisions these.
server {
    listen 80;
    listen [::]:80;
    server_name pms.example.invalid;

    # ACME challenge must stay on port 80.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pms.example.invalid;

    ssl_certificate     /etc/letsencrypt/live/pms.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pms.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:PMS:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/pms;
    index index.html;

    # --- security headers ---
    # The application makes no third-party requests, so the policy is strict.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # --- caching ---
    # index.html must be revalidated so a deployment is picked up. Assets are
    # held, which is safe only while filenames change with content; these do
    # not, so a short max-age is the honest setting rather than immutable.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        # The service worker must never be held, or an update never activates.
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /js/ {
        add_header Cache-Control "public, max-age=600, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=600, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # No directory listings: this is a clinical device, and the file listing
    # tells an attacker what is here.
    autoindex off;

    access_log /var/log/nginx/pms.access.log;
    error_log  /var/log/nginx/pms.error.log warn;
}
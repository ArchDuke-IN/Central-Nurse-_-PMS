<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 660" width="1020" height="660" font-family="Segoe UI, Arial, sans-serif">
  <title>System block diagram: bedside units, segmented network, hub, and outward integrations with the alarm signal path and acknowledgement loop</title>
  <desc>Five bedside monitoring units feed a segmented ethernet switch over an isolated Layer 2 segment. The hub terminates device associations, normalises terminology, evaluates alarm limits and serves the nurse station. Alarms travel on a dedicated high-priority path that does not traverse the archival link. Acknowledgements return from the nurse station to the bedside.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowAlarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowAck" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <style>
      .box   { fill:#f8fafc; stroke:#334155; stroke-width:1.6; rx:6; }
      .safe  { fill:#ecfdf5; stroke:#047857; stroke-width:1.8; rx:6; }
      .alarm { fill:#fef2f2; stroke:#b91c1c; stroke-width:1.8; rx:6; }
      .store { fill:#eff6ff; stroke:#1d4ed8; stroke-width:1.6; rx:6; }
      .grp   { fill:none; stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:5 4; rx:10; }
      .t     { font-size:12.5px; fill:#0f172a; }
      .tb    { font-size:13px; fill:#0f172a; font-weight:600; }
      .ts    { font-size:10.5px; fill:#475569; }
      .lbl   { font-size:11px; fill:#334155; }
      .alarmT{ font-size:11px; fill:#b91c1c; font-weight:600; }
      .ackT  { font-size:11px; fill:#047857; font-weight:600; }
      .glbl  { font-size:12px; fill:#64748b; font-weight:600; letter-spacing:.04em; }
    </style>
  </defs>

  <rect width="1020" height="660" fill="#ffffff"/>

  <!-- ============ LAYER LABELS ============ -->
  <text class="glbl" x="24" y="40">BEDSIDE</text>
  <text class="glbl" x="24" y="280">SEGMENTED LAYER 2</text>
  <text class="glbl" x="404" y="40">CENTRAL HUB (ME SYSTEM)</text>
  <text class="glbl" x="404" y="540">CONSUMERS</text>

  <!-- ============ BEDSIDE UNITS ============ -->
  <rect class="grp" x="16" y="52" width="180" height="470"/>
  <text class="ts" x="26" y="70">Bed head services group</text>

  <g>
    <rect class="box" x="30" y="84"  width="152" height="60"/>
    <text class="tb"  x="42" y="104">BED-01 monitor</text>
    <text class="ts"  x="42" y="121">ECG 5-lead · SpO2 · NIBP · T</text>
    <text class="ts"  x="42" y="136">Type CF (ECG) / BF domain</text>
  </g>
  <g>
    <rect class="box" x="30" y="156" width="152" height="60"/>
    <text class="tb"  x="42" y="176">BED-02 monitor</text>
    <text class="ts"  x="42" y="193">ECG 5-lead · SpO2 · NIBP · T</text>
    <text class="ts"  x="42" y="208">Type CF (ECG) / BF domain</text>
  </g>
  <g>
    <rect class="box" x="30" y="228" width="152" height="60"/>
    <text class="tb"  x="42" y="248">BED-03 monitor</text>
    <text class="ts"  x="42" y="265">ECG 5-lead · SpO2 · NIBP · T</text>
    <text class="ts"  x="42" y="280">Type CF (ECG) / BF domain</text>
  </g>
  <g>
    <rect class="box" x="30" y="300" width="152" height="60"/>
    <text class="tb"  x="42" y="320">BED-04 monitor</text>
    <text class="ts"  x="42" y="337">ECG 5-lead · SpO2 · NIBP · T</text>
    <text class="ts"  x="42" y="352">Type CF (ECG) / BF domain</text>
  </g>
  <g>
    <rect class="box" x="30" y="372" width="152" height="60"/>
    <text class="tb"  x="42" y="392">BED-05 monitor</text>
    <text class="ts"  x="42" y="409">ECG 5-lead · SpO2 · NIBP · T</text>
    <text class="ts"  x="42" y="424">Out of service (X)</text>
  </g>

  <!-- SPARE -->
  <rect class="safe" x="30" y="446" width="152" height="58"/>
  <text class="tb"  x="42" y="466">Spare transport unit</text>
  <text class="ts"  x="42" y="483">Hot-swap cover, 20% spare</text>
  <text class="ts"  x="42" y="497">capacity (N-05 policy)</text>

  <!-- ============ SWITCH ============ -->
  <rect class="grp" x="212" y="52" width="152" height="470"/>
  <rect class="box" x="228" y="150" width="120" height="150"/>
  <text class="tb" x="240" y="176">Managed</text>
  <text class="tb" x="240" y="192">switch</text>
  <text class="ts" x="240" y="214">Dedicated VLAN</text>
  <text class="ts" x="240" y="228">monitoring only</text>
  <text class="ts" x="240" y="246">Segregated from</text>
  <text class="ts" x="240" y="260">EMR / PACS /</text>
  <text class="ts" x="240" y="274">hospital Wi-Fi</text>
  <text class="ts" x="240" y="292">shielded twisted</text>

  <!-- alarms to switch -->
  <g stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#arrowAlarm)">
    <path d="M 182 114 L 228 190"/>
    <path d="M 182 186 L 228 208"/>
    <path d="M 182 258 L 228 226"/>
    <path d="M 182 330 L 228 244"/>
    <path d="M 182 402 L 228 262"/>
  </g>
  <!-- data to switch -->
  <g stroke="#334155" stroke-width="1.3" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 3">
    <path d="M 182 132 L 228 212"/>
    <path d="M 182 204 L 228 230"/>
    <path d="M 182 276 L 228 248"/>
    <path d="M 182 348 L 228 266"/>
  </g>

  <!-- ============ HUB ============ -->
  <rect class="grp" x="396" y="52" width="360" height="452"/>

  <rect class="box" x="408" y="66" width="336" height="54"/>
  <text class="tb" x="420" y="88">Device association gateway</text>
  <text class="ts" x="420" y="106">Terminates monitor sessions; single normalisation point for</text>
  <text class="ts" x="420" y="118">device codes to LOINC + UCUM</text>

  <rect class="safe" x="408" y="134" width="336" height="60"/>
  <text class="tb" x="420" y="156">Alarm evaluation engine (safety function)</text>
  <text class="ts" x="420" y="174">Evaluated at the bedside and at the hub. Never evaluated</text>
  <text class="ts" x="420" y="187">on the archival path.</text>

  <rect class="box" x="408" y="208" width="336" height="54"/>
  <text class="tb" x="420" y="230">Time synchronisation (NTP source)</text>
  <text class="ts" x="420" y="248">Sub-second alignment; without it, alarm timelines</text>
  <text class="ts" x="420" y="260">across five beds cannot be reconciled (N-09)</text>

  <rect class="box" x="408" y="276" width="160" height="76"/>
  <text class="tb" x="420" y="298">PostgreSQL 15+</text>
  <text class="ts" x="420" y="315">System of record</text>
  <text class="ts" x="420" y="329">Range-partitioned</text>
  <text class="ts" x="420" y="343">vitals_log</text>

  <rect class="box" x="584" y="276" width="160" height="76"/>
  <text class="tb" x="596" y="298">FHIR R4 store</text>
  <text class="ts" x="596" y="315">Durable, auditable</text>
  <text class="ts" x="596" y="329">archive. Not the</text>
  <text class="ts" x="596" y="343">real-time path</text>

  <rect class="safe" x="408" y="366" width="336" height="58"/>
  <text class="tb" x="420" y="388">Synchronisation worker (transactional outbox)</text>
  <text class="ts" x="420" y="406">At-least-once; idempotent upserts; tombstones on delete.</text>
  <text class="ts" x="420" y="418">data_erase_at honoured in both stores.</text>

  <rect class="box" x="408" y="438" width="336" height="52"/>
  <text class="tb" x="420" y="460">RAID 1 mirror host + 1 kVA online UPS</text>
  <text class="ts" x="420" y="478">Single point of failure for all five beds (E-07)</text>

  <!-- switch to hub -->
  <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 348 200 L 408 96"/>
    <path d="M 348 222 L 408 160"/>
  </g>
  <!-- internal hub flow -->
  <g stroke="#334155" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M 576 93 L 576 134"/>
    <path d="M 576 194 L 576 208"/>
    <path d="M 500 262 L 500 276"/>
    <path d="M 664 262 L 664 276"/>
    <path d="M 664 352 L 664 366"/>
    <path d="M 500 352 L 500 366"/>
    <path d="M 500 424 L 500 438"/>
  </g>

  <!-- ============ CONSUMERS ============ -->
  <rect class="grp" x="396" y="528" width="360" height="118"/>

  <rect class="safe" x="408" y="544" width="216" height="46"/>
  <text class="tb" x="420" y="564">Nurse station (primary)</text>
  <text class="ts" x="420" y="580">MQTT QoS 1 feed + WebSocket</text>

  <rect class="box" x="636" y="544" width="108" height="46"/>
  <text class="tb" x="648" y="564">Duty desk</text>
  <text class="ts" x="648" y="580">Repeater</text>

  <rect class="store" x="408" y="598" width="104" height="42"/>
  <text class="tb" x="418" y="618">MongoDB</text>
  <text class="ts" x="418" y="632">Read model</text>

  <rect class="store" x="522" y="598" width="108" height="42"/>
  <text class="tb" x="532" y="618">ABDM / ABHA</text>
  <text class="ts" x="532" y="632">Consent-gated</text>

  <rect class="store" x="640" y="598" width="104" height="42"/>
  <text class="tb" x="650" y="618">HMS / EMR</text>
  <text class="ts" x="650" y="632">HL7 v2, billing</text>

  <!-- hub to consumers -->
  <g stroke="#334155" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M 516 490 L 516 544"/>
    <path d="M 600 490 L 690 544"/>
  </g>
  <g stroke="#1d4ed8" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M 470 424 L 470 598"/>
    <path d="M 576 424 L 576 598"/>
    <path d="M 692 424 L 692 598"/>
  </g>

  <!-- ============ ALARM SIGNAL PATH (red, high priority) ============ -->
  <path class="" d="M 744 140 L 880 140 L 880 300 L 560 300 L 560 194"
        stroke="#b91c1c" stroke-width="2.4" fill="none" marker-end="url(#arrowAlarm)"/>
  <text class="alarmT" x="700" y="132">ALARM SIGNAL PATH — high priority, does not traverse the archival link</text>
  <text class="alarmT" x="600" y="294">annunciate</text>

  <!-- ============ ACKNOWLEDGEMENT LOOP (green) ============ -->
  <path d="M 470 590 L 300 590 L 300 96 L 106 96"
        stroke="#047857" stroke-width="2.2" fill="none" marker-end="url(#arrowAck)"/>
  <text class="ackT" x="180" y="580">ACKNOWLEDGEMENT LOOP — operator identity captured in alarm_acknowledgements</text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(772,540)">
    <rect x="0" y="0" width="232" height="104" fill="#ffffff" stroke="#cbd5e1" rx="6"/>
    <text class="tb" x="12" y="20">Legend</text>
    <line x1="12" y1="34" x2="46" y2="34" stroke="#b91c1c" stroke-width="2.4"/>
    <text class="lbl" x="54" y="38">Alarm (safety path)</text>
    <line x1="12" y1="52" x2="46" y2="52" stroke="#047857" stroke-width="2.2"/>
    <text class="lbl" x="54" y="56">Acknowledgement</text>
    <line x1="12" y1="70" x2="46" y2="70" stroke="#334155" stroke-width="1.4"/>
    <text class="lbl" x="54" y="74">Data / command</text>
    <line x1="12" y1="88" x2="46" y2="88" stroke="#334155" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text class="lbl" x="54" y="92">Optional link</text>
  </g>
</svg>

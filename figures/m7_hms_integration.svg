<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="1020" height="620" font-family="Segoe UI, Arial, sans-serif">
  <title>Hospital management system integration map showing admission and discharge hooks, billing events and inventory alerts</title>
  <desc>The patient monitoring system sits between the ward and the hospital management system. Admission and discharge events flow inward from the hospital management system to create and close encounters. Billing events and consumable usage flow outward. Inventory alerts are raised when stock falls to the reorder level. A nurse call system is shown as a parallel system with a defined alarm severity hierarchy.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .core  { fill:#eff6ff; stroke:#1d4ed8; stroke-width:2.4; rx:8; }
      .ext   { fill:#ffffff; stroke:#475569; stroke-width:1.8; rx:6; }
      .inv   { fill:#fffbeb; stroke:#b45309; stroke-width:1.8; rx:6; }
      .nc    { fill:#fef2f2; stroke:#b91c1c; stroke-width:1.8; rx:6; }
      .grp   { fill:none; stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:5 4; rx:10; }
      .t   { font-size:11px; fill:#0f172a; }
      .tb  { font-size:12.5px; fill:#0f172a; font-weight:700; }
      .ts  { font-size:9.5px; fill:#475569; }
      .gl  { font-size:11px; font-weight:700; fill:#334155; letter-spacing:.05em; }
      .in  { stroke:#1d4ed8; stroke-width:1.9; fill:none; marker-end:url(#ar); }
      .out { stroke:#b45309; stroke-width:1.9; fill:none; marker-end:url(#arO); }
      .alt { stroke:#b91c1c; stroke-width:1.6; fill:none; marker-end:url(#arR); }
      .fl  { font-size:9.5px; fill:#0f172a; font-weight:600; }
    </style>
  </defs>

  <rect width="1020" height="620" fill="#ffffff"/>

  <text class="gl" x="24" y="26" fill="#0f172a">FIGURE 5 — HOSPITAL MANAGEMENT SYSTEM INTEGRATION MAP</text>

  <!-- ================= HOSPITAL SYSTEMS ================= -->
  <rect class="grp" x="20" y="46" width="270" height="330"/>
  <text class="gl" x="32" y="66">HOSPITAL SYSTEMS</text>

  <rect class="ext" x="32" y="78" width="246" height="62"/>
  <text class="tb" x="42" y="97">ADMISSION / DISCHARGE</text>
  <text class="ts" x="42" y="113">Register patient, assign bed, open</text>
  <text class="ts" x="42" y="125">encounter. On discharge, close it.</text>

  <rect class="ext" x="32" y="152" width="246" height="62"/>
  <text class="tb" x="42" y="171">BILLING / REVENUE</text>
  <text class="ts" x="42" y="187">Bed-day charge, device usage,</text>
  <text class="ts" x="42" y="199">consumable line items.</text>

  <rect class="ext" x="32" y="226" width="246" height="62"/>
  <text class="tb" x="42" y="245">INVENTORY / STORES</text>
  <text class="ts" x="42" y="261">Reorder points for electrodes,</text>
  <text class="ts" x="42" y="273">probes, cuffs, temperature probes.</text>

  <rect class="ext" x="32" y="300" width="246" height="62"/>
  <text class="tb" x="42" y="319">STAFF DIRECTORY</text>
  <text class="ts" x="42" y="335">Registration numbers and roles,</text>
  <text class="ts" x="42" y="347">for alarm attribution.</text>

  <!-- ================= INTERFACE ================= -->
  <rect class="grp" x="316" y="46" width="200" height="330"/>
  <text class="gl" x="328" y="66">INTERFACE</text>

  <rect class="ext" x="328" y="78" width="176" height="120" fill="#f8fafc"/>
  <text class="tb" x="338" y="97">EVENT DRIVEN</text>
  <text class="ts" x="338" y="114">Transactional hooks on</text>
  <text class="ts" x="338" y="126">commit. Never polled.</text>
  <text class="ts" x="338" y="146">Every event carries the</text>
  <text class="ts" x="338" y="158">source identifier and is</text>
  <text class="ts" x="338" y="170">idempotent on receipt.</text>
  <text class="ts" x="338" y="188">Outbox pattern: written</text>
  <text class="ts" x="338" y="200">in the same transaction</text>

  <rect class="ext" x="328" y="210" width="176" height="80" fill="#f8fafc"/>
  <text class="tb" x="338" y="229">HL7 v2.3.1</text>
  <text class="ts" x="338" y="245">Patient admin and</text>
  <text class="ts" x="338" y="257">observation reporting.</text>
  <text class="ts" x="338" y="271">Frames 0x0B … 0x1C 0x0D</text>
  <text class="ts" x="338" y="283">ISO 8859-1</text>

  <rect class="ext" x="328" y="302" width="176" height="60" fill="#f8fafc"/>
  <text class="tb" x="338" y="321">RELAY CLOCK</text>
  <text class="ts" x="338" y="337">No clinical alarm may</text>
  <text class="ts" x="338" y="349">transit this interface.</text>

  <!-- ================= PMS ================= -->
  <rect class="grp" x="542" y="46" width="200" height="330"/>
  <text class="gl" x="554" y="66">PATIENT MONITORING SYSTEM</text>

  <rect class="core" x="554" y="78" width="176" height="292"/>
  <text class="tb" x="564" y="98">PMS</text>

  <text class="gl" x="564" y="122" font-size="10">WARD SIDE</text>
  <text class="ts" x="564" y="137">Bedside units</text>
  <text class="ts" x="564" y="150">Nurse station</text>
  <text class="ts" x="564" y="163">Alarm engine</text>

  <text class="gl" x="564" y="188" font-size="10">CLINICAL MODEL</text>
  <text class="ts" x="564" y="203">admissions</text>
  <text class="ts" x="564" y="216">bed_assignments</text>
  <text class="ts" x="564" y="229">vitals_log</text>
  <text class="ts" x="564" y="242">alerts</text>

  <text class="gl" x="564" y="267" font-size="10">LEDGER</text>
  <text class="ts" x="564" y="282">consumable_usage</text>
  <text class="ts" x="564" y="295">billing_events</text>
  <text class="ts" x="564" y="308">consumables</text>
  <text class="ts" x="564" y="321">sync_outbox</text>

  <text class="ts" x="564" y="348" font-weight="700">No dual write.</text>
  <text class="ts" x="564" y="360">Every outbound change</text>
  <text class="ts" x="564" y="372" font-weight="700">passes the outbox.</text>

  <!-- ================= NURSE CALL ================= -->
  <rect class="grp" x="768" y="46" width="232" height="330"/>
  <text class="gl" x="780" y="66">WARD ALARM ANNUNCIATION</text>

  <rect class="nc" x="780" y="78" width="208" height="120"/>
  <text class="tb" x="790" y="97" fill="#b91c1c">NURSE CALL SYSTEM</text>
  <text class="ts" x="790" y="114">A parallel system with no</text>
  <text class="ts" x="790" y="126">interface to the monitor by</text>
  <text class="ts" x="790" y="138">default. Grade 1 relay</text>
  <text class="ts" x="790" y="150">contact closure from the</text>
  <text class="ts" x="790" y="162">monitor output.</text>
  <text class="ts" x="790" y="180" font-weight="700">Routing monitor alarms here</text>
  <text class="ts" x="790" y="192" font-weight="700">creates a distributed alarm</text>

  <rect class="ext" x="780" y="210" width="208" height="160" fill="#f8fafc"/>
  <text class="tb" x="790" y="229">SEVERITY HIERARCHY</text>
  <text class="ts" x="790" y="248" font-weight="700">1. Code Blue</text>
  <text class="ts" x="790" y="262" font-weight="700">2. Monitor HIGH priority</text>
  <text class="ts" x="790" y="276" font-weight="700">3. Monitor MEDIUM priority</text>
  <text class="ts" x="790" y="290" font-weight="700">4. Code Red</text>
  <text class="ts" x="790" y="304" font-weight="700">5. Monitor LOW priority</text>
  <text class="ts" x="790" y="318" font-weight="700">6. Routine nurse call</text>
  <text class="ts" x="790" y="338">INFORMATION signals are</text>
  <text class="ts" x="790" y="350">not alarm conditions and</text>
  <text class="ts" x="790" y="362">must not be routed as one.</text>

  <!-- ================= ARROWS ================= -->
  <path class="in" d="M 278 100 L 328 100"/>
  <text class="fl" x="284" y="94" fill="#1d4ed8">admit</text>

  <path class="in" d="M 278 130 L 328 130"/>
  <text class="fl" x="284" y="124" fill="#1d4ed8">discharge</text>

  <path class="out" d="M 730 190 L 278 190 L 278 178"/>
  <text class="fl" x="380" y="184" fill="#b45309">bed-day and device-usage charges</text>

  <path class="out" d="M 730 250 L 278 250 L 278 254"/>
  <text class="fl" x="380" y="244" fill="#b45309">consumable line items</text>

  <path class="in" d="M 278 300 L 730 300 L 730 328"/>
  <text class="fl" x="380" y="294" fill="#1d4ed8">reorder point breach</text>

  <path class="in" d="M 278 342 L 730 342 L 730 160 L 554 160"/>
  <text class="fl" x="380" y="336" fill="#1d4ed8">staff registration and roles</text>

  <path class="alt" d="M 730 340 L 760 340 L 760 130 L 780 130"/>
  <text class="fl" x="742" y="126" fill="#b91c1c" text-anchor="start" transform="rotate(-90 742 126)">relay</text>

  <!-- ================= FOOTNOTES ================= -->
  <g transform="translate(20,396)">
    <rect x="0" y="0" width="980" height="204" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>

    <text class="gl" x="14" y="22">INTEGRATION DECISIONS AND THEIR REASONS</text>

    <text class="tb" x="14" y="46">Admission and discharge are hooks, not polls.</text>
    <text class="ts" x="14" y="62">An admission creates the encounter, the bed assignment and the ABHA care context in one transaction, so</text>
    <text class="ts" x="14" y="76">a vitals row always has an episode to belong to. Polling would permit an observation to arrive for an</text>
    <text class="ts" x="14" y="90">episode that does not yet exist.</text>

    <text class="tb" x="14" y="114">Billing is generated from consumption, not from a tariff lookup.</text>
    <text class="ts" x="14" y="130">A consumable line item is raised when stock is issued to a bed, and it carries the cost captured at</text>
    <text class="ts" x="14" y="144">issue time rather than at billing time. The largest cost lever in the whole system is the single</text>
    <text class="ts" x="14" y="158">policy decision on whether probes are reusable or single-patient disposable.</text>

    <text class="tb" x="520" y="46">Inventory alerting is a reorder point, not a minimum.</text>
    <text class="ts" x="520" y="62">Alerting fires when on-hand reaches the reorder level, which accounts for lead time. An alert at</text>
    <text class="ts" x="520" y="76">the reorder level rather than at zero is the only variant that prevents a stock-out on a bed.</text>

    <text class="tb" x="520" y="100">The interface carries records, never alarms.</text>
    <text class="ts" x="520" y="116">No clinical alarm transits the hospital interface. Alarm annunciation is a safety function with its</text>
    <text class="ts" x="520" y="130">own latency budget, and coupling it to a message broker would make a staffing or network problem</text>
    <text class="ts" x="520" y="144">into a patient-safety problem.</text>

    <text class="tb" x="14" y="182">Nurse-call integration is graded, and the highest grade carries a standards obligation.</text>
    <text class="ts" x="520" y="182">Once monitor alarms reach a nurse-call console, the combination is a distributed alarm system and</text>
    <text class="ts" x="520" y="196">inherits the delay-disclosure and failure-indication duties of the alarm standard. Grade 1 relay</text>
  </g>
</svg>
